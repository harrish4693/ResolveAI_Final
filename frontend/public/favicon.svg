<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Deep Obsidian) -->
    <linearGradient id="resolveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A14"/>
      <stop offset="100%" stop-color="#080A08"/>
    </linearGradient>

    <!-- Vibrant Neon Lime Gradient -->
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BBFF45"/>
      <stop offset="100%" stop-color="#A7FE08"/>
    </linearGradient>

    <!-- Secondary Forest Chat Bubble Gradient -->
    <linearGradient id="forestBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2418"/>
      <stop offset="100%" stop-color="#10160F"/>
