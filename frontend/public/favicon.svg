  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#resolveBg)" stroke="#30382C" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#A7FE08" stroke-opacity="0.14" stroke-width="0.75"/>

