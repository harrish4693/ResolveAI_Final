name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      JWT_SECRET_KEY: ci_insecure_jwt_secret_key_minimum_32_chars_for_hashing
      AI_PROVIDER: mock
      RAG_RETRIEVER: tfidf
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      SARVAM_API_KEY: ci_mock_sarvam_api_key_for_testing
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      APP_ENV: testing
      DEBUG: "true"
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic migration schema
        working-directory: backend
        run: |
          python -m alembic upgrade head

      - name: Run Pytest test suite
        working-directory: backend
        run: |
          python -m pytest -v --tb=short

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit & integration tests
        working-directory: frontend
        run: npm test

      - name: Build production SSR bundle
        working-directory: frontend
        env:
          NITRO_PRESET: node-server
        run: npm run build

  docker-validation:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          docker compose config
          docker compose -f docker-compose.sqlite.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: resolveai-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: resolveai-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

