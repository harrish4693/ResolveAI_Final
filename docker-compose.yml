services:
  postgres:
    image: postgres:15-alpine
    container_name: resolveaiv2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-resolveaidb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resolveaidb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resolveai_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resolveaiv2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resolveaidb}}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-resolveaidb}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_insecure_secret_key_change_in_production}
      - ENVIRONMENT=production
    volumes:
      - audio_data:/app/data/audio
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - resolveai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resolveaiv2-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - resolveai_net

volumes:
  postgres_data:
  audio_data:
  sqlite_data:

networks:
  resolveai_net:
    driver: bridge
